name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookrelay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookrelay_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookrelay_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run migrate:deploy -w @hookrelay/api
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests (real Postgres)
        run: npm test
      - name: Build API and web
        run: npm run build

  loadtest:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookrelay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookrelay
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      METRICS_TOKEN: ci-metrics-token
      FRONTEND_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:8080
      INGEST_RATE_LIMIT_PER_MIN: '1000000'
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate:deploy -w @hookrelay/api
      - run: npm run build -w @hookrelay/api
      - name: Start API
        run: |
          node apps/api/dist/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: k6 ingest (50 VUs, 30s)
        run: k6 run --summary-export=k6-summary.json loadtest/ingest.js
      - uses: actions/upload-artifact@v5
        with:
          name: k6-summary
          path: k6-summary.json
